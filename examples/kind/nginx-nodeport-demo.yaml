# Optional demo for labs/lab-07-kubernetes-kind.md — exposes nginx on fixed NodePort 30080.
# Prefer `kubectl port-forward` when NodePort behaves differently on Podman/rootless.
apiVersion: v1
kind: Service
metadata:
  name: nginx-kind-lab
spec:
  type: NodePort
  selector:
    app: nginx-kind-lab
  ports:
    - port: 80
      nodePort: 30080
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-kind-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-kind-lab
  template:
    metadata:
      labels:
        app: nginx-kind-lab
    spec:
      containers:
        - name: nginx
          image: nginx:stable-alpine
          ports:
            - containerPort: 80
